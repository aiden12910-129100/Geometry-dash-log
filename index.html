<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的自动图库</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h1>我的图片库</h1>
    <div id="gallery" class="gallery">正在加载图片...</div>

    <script>
        // === 请修改这里的配置 ===
        const USERNAME = 'aiden12910-129100'; // 例如：zhangsan
        const REPO = 'Geometry-dash-log';           // 例如：my-gallery
        const FOLDER_PATH = 'images';      // 你的图片文件夹名称
        // =======================

        const apiUrl = `https://github.com{USERNAME}/${REPO}/contents/${FOLDER_PATH}`;

        async function loadImages() {
            const galleryEl = document.getElementById('gallery');
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('无法获取目录内容');
                const files = await response.json();

                // 筛选出图片文件（支持常见的 jpg, jpeg, png, gif, webp）
                const imageFiles = files.filter(file => 
                    /\.(jpe?g|png|gif|webp)\$/i.test(file.name)
                );

                if (imageFiles.length === 0) {
                    galleryEl.innerHTML = '<p style="text-align:center;">文件夹里还没有图片哦~</p>';
                    return;
                }

                galleryEl.innerHTML = '';
                imageFiles.forEach(file => {
                    const img = document.createElement('img');
                    // 使用 github raw 或者是 download_url 来展示图片
                    img.src = file.download_url;
                    img.alt = file.name;
                    galleryEl.appendChild(img);
                });

            } catch (error) {
                console.error(error);
                galleryEl.innerHTML = '<p style="text-align:center; color:red;">加载图片失败，请检查脚本中的用户名、仓库名配置是否正确。</p>';
            }
        }

        loadImages();
    </script>
</body>
</html>
